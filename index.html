<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>My Paisa</title>
    <meta name="description" content="Offline-first personal finance manager. Your data stays on your device." />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
      /* Painted before any JS loads, so the app never flashes white on launch.
         The old build had no pre-hydration background, which on Android showed
         a white frame between the native splash and the React tree mounting. */
      html, body { margin: 0; background: #09090b; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
      }
      #boot img { width: 96px; height: 96px; object-fit: contain; animation: bootPulse 1.4s ease-in-out infinite; }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50%      { opacity: 1;    transform: scale(1.03); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Removed by main.tsx once React has mounted. -->
    <div id="boot">
      <img src="/logo.png" alt="My Paisa" />
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
