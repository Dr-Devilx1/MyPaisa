name: Build Android APK

# Builds My Paisa into an installable APK.
#
# HOW TO USE
#   1. Push this project to a GitHub repository.
#   2. Open the "Actions" tab -> "Build Android APK" -> "Run workflow".
#   3. Wait ~5 minutes, then download "My Paisa-debug-apk" from the run page.
#   4. Copy the .apk to your phone and open it (allow "install unknown apps").
#
# The debug APK is signed with Android's standard debug key. That is fine for
# installing on your own device; it is NOT accepted by the Play Store. For a
# Play-ready build see the `release` job at the bottom.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run typecheck

      - name: Build web bundle
        run: npx vite build

      # brand/android-res is committed, so this is a refresh, not a requirement.
      - name: Regenerate brand assets (optional)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user --break-system-packages Pillow
          python3 brand/generate_assets.py

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor + apply icons and splash
        run: |
          npx cap sync android
          node scripts/apply-android-assets.mjs

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/My Paisa-debug-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My Paisa-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Optional: a signed release APK + AAB for the Play Store.
  #
  # This job SKIPS ITSELF unless you add four repository secrets:
  #   ANDROID_KEYSTORE_BASE64  - base64 of your .jks file
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #
  # Create a keystore once with:
  #   keytool -genkey -v -keystore mypaisa.jks -keyalg RSA -keysize 2048 \
  #           -validity 10000 -alias mypaisa
  #   base64 -w0 mypaisa.jks > mypaisa.jks.b64
  #
  # KEEP THAT .jks FILE SAFE. Lose it and you can never update the app on the
  # Play Store under the same listing.
  # ---------------------------------------------------------------------------
  release-apk:
    name: Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for signing secrets
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No signing secrets configured — skipping the release build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        if: steps.check.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Build web bundle
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci || npm install
          npx vite build
          python3 -m pip install --quiet --user --break-system-packages Pillow || true
          python3 brand/generate_assets.py || true
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node scripts/apply-android-assets.mjs

      - name: Decode keystore
        if: steps.check.outputs.ready == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/mypaisa.jks

      - name: Write signing config
        if: steps.check.outputs.ready == 'true'
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file('mypaisa.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build signed release
        if: steps.check.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed artifacts
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: My Paisa-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
